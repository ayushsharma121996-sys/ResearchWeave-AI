[project]
name = "research-weave-ai"
version = "0.1.0"
description = "ResearchWeave AI - AI Research Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymupdf>=1.24.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "api/index.py"
